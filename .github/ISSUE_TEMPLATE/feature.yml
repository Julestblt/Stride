name: Feature or architecture proposal
description: Propose scoped product or platform work.
title: "[Feature]: "
body:
  - type: input
    id: epic
    attributes:
      label: Epic or product requirement
      description: Reference a docs/epics key, parent issue, or PRD requirement.
      placeholder: E-01 or FR-01
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why does this work matter? Link the relevant planning and architecture documents.
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: State the outcome this issue should deliver.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: State what is included.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: State what this issue explicitly does not include.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions for completion.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: input
    id: dependencies
    attributes:
      label: Dependencies
      description: Link prerequisite issues or enter None.
      placeholder: None
  - type: textarea
    id: references
    attributes:
      label: References
      description: Link the BMAD spec, PRD requirements, epic, ADR, or design artifact.
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: Testing expectations
      description: List expected tests and other verification evidence.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Data, architecture, and verification notes
      description: Include known constraints, affected areas, and expected checks.
    validations:
      required: false
