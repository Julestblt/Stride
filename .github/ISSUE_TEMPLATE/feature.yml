name: Feature or architecture proposal
description: Propose scoped product or platform work.
title: "[Feature]: "
body:
  - type: input
    id: epic
    attributes:
      label: Epic or product requirement
      description: Reference a docs/epics key, parent issue, or PRD requirement.
      placeholder: E-01 or FR-01
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why does this work matter? Link the relevant planning and architecture documents.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has this problem and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should become possible?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: State what is included and explicitly out of scope.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions for completion.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: input
    id: dependencies
    attributes:
      label: Dependencies
      description: Link prerequisite issues or enter None.
      placeholder: None
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: List expected tests, review, or other completion evidence.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Data, architecture, and verification notes
      description: Include known constraints, affected areas, and expected checks.
    validations:
      required: false
