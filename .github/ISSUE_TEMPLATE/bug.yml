name: Bug report
description: Report incorrect or unexpected behavior.
title: "[Bug]: "
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List reliable steps and relevant environment details.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Expected fix scope
      description: Describe the intended correction and what is out of scope.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that show the issue is fixed.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Link relevant issues, PRD requirements, architecture, or design documents.
    validations:
      required: false
  - type: textarea
    id: testing
    attributes:
      label: Testing expectations
      description: List expected regression tests and other verification evidence.
    validations:
      required: true
