name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:e2e
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npx supabase db reset
      - run: npm run db:advisors
      - run: scripts/supabase-garmin-schema.sh
      - run: npm run db:test
      - run: npm run db:types && git diff --exit-code src/server/supabase/database.types.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:onboarding
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onboarding-screenshots
          path: test-results/onboarding-*.png
          if-no-files-found: warn
          retention-days: 7
